name: Update game data

# Rebuilds assets/data from public game data once a day and commits the result when something changed.
# Run it by hand from the Actions tab with "Run workflow".
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: lore-cache-${{ github.run_id }}
          restore-keys: lore-cache-
      - name: Install updater dependencies
        working-directory: tools
        run: npm install --no-audit --no-fund
      - name: Rebuild data
        working-directory: tools
        env:
          LORE_CACHE: ${{ github.workspace }}/.cache
        run: node update.mjs
      - name: Commit changes
        run: |
          git config user.name "lore-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update game data"
            git push
          fi
