name: Update game data

# Rebuilds assets/data from public game data once a day and commits the result when something changed.
# Run it by hand from the Actions tab with "Run workflow".
on:
  schedule:
    # Daily server reset is 4:00 AM China time (UTC+8) = 20:00 UTC = 1:30 AM India time.
    # Run a few minutes after it, so new daily data (and a new Theater season on the 1st) is picked up.
    - cron: "5 20 * * *"
    # Second pass at 11:35 AM China time, after version-day maintenance and phase-2 banners go live.
    - cron: "35 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Restore download cache
        uses: actions/cache@v4
        with:
          path: .cache
          key: lore-cache-${{ github.run_id }}
          restore-keys: lore-cache-
      - name: Install updater dependencies
        working-directory: tools
        run: npm install --no-audit --no-fund
      - name: Rebuild data
        working-directory: tools
        env:
          LORE_CACHE: ${{ github.workspace }}/.cache
        run: node update.mjs
      - name: Commit changes
        run: |
          git config user.name "lore-atlas-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Update game data"
            git push
          fi
      - name: Keep the content checklist issue up to date
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="Content to write for Lore Atlas"
          NUM=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          if [ -s .cache/checklist.md ]; then
            if [ -n "$NUM" ]; then gh issue edit "$NUM" --body-file .cache/checklist.md; else gh issue create --title "$TITLE" --body-file .cache/checklist.md; fi
          elif [ -n "$NUM" ]; then
            gh issue close "$NUM" --comment "Everything on the list has been written."
          fi
